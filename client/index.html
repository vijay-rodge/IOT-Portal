<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>IoT Knowledge Portal - Learn, Build, and Master IoT Devices</title>
    <meta name="description" content="Comprehensive educational and reference platform for IoT devices, microcontrollers, sensors, actuators, pinouts, protocols, and working principles." />

    <!-- PWA & Mobile Web App Meta -->
    <meta name="theme-color" content="#0284c7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IoT Portal" />
    <meta name="application-name" content="IoT Knowledge Portal" />
    <meta name="msapplication-TileColor" content="#0284c7" />

    <!-- Google Fonts Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen antialiased selection:bg-brand-500 selection:text-white">
    <div id="root">
      <!-- App Shell Preloader: Shown before JavaScript bundle mounts -->
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0b1329; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; text-align: center; padding: 20px;">
        <div style="width: 72px; height: 72px; border-radius: 20px; background: linear-gradient(135deg, #0284c7, #0ea5e9); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.4); margin-bottom: 24px;">
          <svg style="width: 40px; height: 40px; fill: none; stroke: #ffffff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;" viewBox="0 0 24 24">
            <rect width="16" height="16" x="4" y="4" rx="2"></rect>
            <rect width="6" height="6" x="9" y="9" rx="1"></rect>
            <path d="M15 2v2"></path>
            <path d="M15 20v2"></path>
            <path d="M2 15h2"></path>
            <path d="M2 9h2"></path>
            <path d="M20 15h2"></path>
            <path d="M20 9h2"></path>
            <path d="M9 2v2"></path>
            <path d="M9 20v2"></path>
          </svg>
        </div>
        <h1 style="font-size: 20px; font-weight: 700; margin: 0 0 8px 0; letter-spacing: -0.02em; color: #ffffff;">IoT Knowledge Portal</h1>
        <p style="font-size: 13px; color: #94a3b8; margin: 0 0 24px 0; max-width: 280px; line-height: 1.5;">Initializing hardware taxonomy and technical specifications...</p>
        <div style="width: 36px; height: 36px; border: 3px solid rgba(2, 132, 199, 0.2); border-top-color: #38bdf8; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <style>
          @keyframes spin {
            to { transform: rotate(360deg); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
